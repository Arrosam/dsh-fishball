<style>
.oas{flex:none;width:280px;min-height:0;height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:6px 8px;background:var(--sidebar);color:var(--text);border-right:1px solid var(--border);font-size:14px;line-height:20px;position:relative}

.oas .oas-hit:hover,.oas [aria-current=page],.oas .oas-focus{background:var(--hover)}

<script>
function chat(id){
  const native=['wide-closed','wide-open','rail-closed','rail-open','empty','new','new-claude','backend'].includes(id);
  const fish=['fishball','takeback-fish','returned-fish'].includes(id);
  const returned=['returned','returned-fish'].includes(id), managed=['fishball','takeback-fish','managed','takeback'].includes(id), running=managed||returned;
  const ended=id==='ended';
  const principal='Fishball · fb-07', model=(!fish&&['idle','models','handoff','managed','takeback','returned','end','ended'].includes(id)&&overlay.model)||'codex-fixture-a';
  const failures={approval:['Publish draft','Waiting for you','Permission prompt needs a human','Codex is waiting for a decision. The native prompt could not be verified, so neither DSH nor Fishball can answer it. Automation is paused. End the owned process before continuing outside DSH; never open a second writer.','Prepare a draft for publication.','Your draft is ready for review. Nothing has been published.'],auth:['Workspace sync','Sign-in required','Sign in outside DSH','Collection has stopped. Sign in through Codex outside DSH, then start a new session. Do not paste credentials here.','Summarize the workspace changes.','The workspace summary is ready.'],degraded:['Migration notes','Degraded · Input disabled','This Codex build is not supported','The message format changed. Only verified messages are shown. Use a supported build before starting another session.','List the steps for moving atlas.','Copy the workspace, verify the new path, and check the project references.'],disconnected:['Archive review','Disconnected','Exact resume is unavailable','Resume requires the exact provider session ID in atlas and proof that no other writer survives. Exclusive ownership could not be verified. Start a new session instead.','',''],error:['Changelog proof','Delivery uncertain','The last message may have reached Codex','No acknowledgment arrived. Do not resend. Check the existing session before taking further action. The unconfirmed message is not in this history.','Check the changelog headings.','The headings match the order of the release sections.']};
  const failure=failures[id]; const title=native?'Workspace notes':fish?'Audit checklist':failure?failure[0]:'Release notes';
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const act=(label,ico,to,reason='')=>to?`<a class="ch-action" href="#${to}">${icon(ico,14)}${label}</a>`:`<button type="button" class="ch-action" disabled title="${reason}">${icon(ico,14)}${label}</button>`;
  const ident=(ico,text)=>`<span class="ch-identity">${icon(ico,14)}${text}</span>`;
  const hand=act('Hand to Fishball','link',running||failure||ended?'':'handoff',running?'Wait for the turn to finish.':'The session is not ready for handoff.');
  const headerActions=native?'':managed?act('Take back','user',fish?'takeback-fish':'takeback'):ended?act('New session','plus','new'):hand;
  const endAct=!native&&!fish&&!ended&&!failure&&!managed?act('End','x','end'):'';
  const owner=managed?'Managed by '+principal:ended||id==='disconnected'?'No active writer':'Controlled by you';
  const hdr=`<header><div class="ch-title"><span class="ch-crumb">${icon('folder',15)} &nbsp;atlas &nbsp;/</span><h1>${title}</h1><div class="ch-tools">${headerActions}${endAct}</div></div><div class="ch-meta"><span class="ch-tab">${icon('message',14)}Chat</span>${native?'':ident('terminal','Codex')+ident('check',(failure||ended?'Last confirmed: ':'Confirmed: ')+model)+ident(managed?'link':'user',owner)}</div></header>`;
  const user=(text,author='You',time='10:24')=>`<article class="ch-human"><div class="ch-who"><strong>${author}</strong><time>${time}</time></div><div class="ch-bubble">${esc(text)}</div></article>`;
  const reply=(html,time='10:25')=>`<article><div class="ch-who">${icon('bot',16)}<strong>${native?'Assistant':'Codex'}</strong><time>${time}</time></div><div class="ch-prose">${html}</div></article>`;
  const boundary=t=>`<p class="ch-bound">${t}</p>`;
  const releasePrompt=(typeof overlay==='function'&&overlay.firstMessage)||'Draft release notes for atlas from the changes since the last tag.';
  const release=user(releasePrompt)+reply('<p>Here’s a draft for the next atlas release:</p><ul><li><strong>Workspace search</strong> now includes archived notes.</li><li><strong>Export</strong> keeps your section order when saving to Markdown.</li><li><strong>Fix:</strong> reopening a workspace restores the last selected note.</li></ul>');
  let messages=native?user('What should we keep in the atlas workspace notes?')+reply('<p>Keep a short entry for each decision. Record what changed, why it changed, and who will follow up.</p><p>A useful first entry is the release checklist. Link the draft notes and leave room for sign-off.</p>'):fish?boundary('Started by '+principal)+user('Build an audit checklist for the atlas release.',principal)+reply('<p>Check the version tag, match each change to a release note, and record who signed off.</p>')+user('Add the evidence to collect for each check.',principal,'10:28'):failure?id==='disconnected'?'<div class="ch-empty"><strong>Session metadata only</strong><p>The previous connection is gone. Its conversation was not retained.</p></div>':user(failure[4])+reply('<p>'+failure[5]+'</p>'):release;
  if(!fish&&running) messages+=boundary('Shared with Fishball from 10:27 · earlier messages stay private')+user('List the items to verify before publishing.',principal,'10:28');
  if(returned)messages+=boundary('You took back control · 10:29');
  if(running)messages+='<div class="ch-dots"><i></i>Codex is working…</div>';
  if(ended)messages+=boundary('Session ended');
  const timeline=`<section class="ch-scroll" aria-label="Conversation messages"><div class="ch-flow"><p class="ch-days">Today</p>${messages}</div></section>`;
  const status=ended?'Ended':failure?failure[1]:running?'Running':'Idle';
  const explanation=returned?'You can stop this turn. Fishball’s pending input was discarded.':managed?'You are observing. Only Fishball can send or stop this turn.':failure?'Sending and model changes are disabled.':ended?'This session is no longer accepting messages.':'Ready for your next message.';
  const strip=native?'':`<div class="ch-state" role="status"><span class="ch-cli-tag">CLI · Codex</span><span class="ch-status-name">${icon(failure?'alert':running?'clock':ended?'stop':'check',14)}${status}</span><span class="ch-soft">${explanation}</span></div>`;
  const failureActions=id==='disconnected'?act('Resume exact session','lock','','Exclusive ownership not verified.')+act('New session','plus','new'):['degraded','auth'].includes(id)?act('New session','plus','new'):'';
  const warning=!failure?'':`<aside class="ch-alert"><strong>${icon('alert',16)}${failure[2]}</strong><p>${failure[3]}</p>${id==='error'?'<p>Session ID: <span class="ch-id">oa-atlas-06</span></p>':''}${failureActions?`<div class="ch-tools">${failureActions}</div>`:''}</aside>`;
  const picker=id!=='models'?'':`<section class="ch-picker" aria-label="Codex model catalog"><div class="ch-picktitle">Codex models<a href="#idle" aria-label="Close models">${icon('x',15)}</a></div><small>atlas · CLI-local fixture catalog · revision 04</small><div class="ch-pickrow"><span>${model}</span><span>${icon('check',13)} Current</span></div><div class="ch-pickrow"><span>${model==='codex-fixture-a'?'codex-fixture-b':'codex-fixture-a'}</span><small>Launch only</small></div><div class="ch-pickrow"><span>CLI default</span><small>New sessions only</small></div><p>Live switching is not verified. Start a new session to choose a launch model.</p><div style="margin-top:8px">${act('New session','plus','new')}</div></section>`;
  const canType=!failure&&!running&&!ended, placeholder=managed?'Read-only while Fishball controls this session':returned?'Wait for the active turn to finish, or stop it':ended?'Session ended':failure?'Input unavailable · '+status:native?'Message the assistant…':'Message Codex…';
  const choose=native?ident('folder','atlas'):canType&&!fish?`<a class="ch-action" href="#${id==='models'?'idle':'models'}" aria-expanded="${id==='models'}">${icon('terminal',14)}${model}${icon('chevron-down',13)}</a>`:act(model,'lock','','Model changes are unavailable in this state.');
  const submit=returned?`<button type="button" class="ch-action ch-submit" onclick="this.closest('.ch-compose').querySelector('.ch-note').textContent='Preview: Stop interrupts only this turn. The session stays open.'">${icon('stop',14)}Stop turn</button>`:`<button class="ch-action ch-submit" disabled title="${canType?'Message sending is not connected in this mockup.':explanation}">${icon(managed?'stop':'send',14)}${managed?'Stop turn':'Send'}</button>`;
  const bar=`<section class="ch-compose" aria-label="Message composer">${warning}${strip}<div class="ch-card">${picker}<textarea rows="2" aria-label="${placeholder}" placeholder="${placeholder}" ${canType?'':'disabled'}></textarea><div class="ch-card-row">${choose}${submit}</div></div><div class="ch-note">${native?'':fish?'Started by '+principal:'Started by you'}${!native?' &nbsp;·&nbsp; '+(ended?'Session closed':'Outside agent session'):''}</div></section>`;
  return `<main class="oa-chat" aria-label="${title}">${hdr}${timeline}${bar}</main>`;
}
</script>

<style>

.oad-card{width:min(100%,452px);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 44px #0002;padding:24px;font-size:14px;line-height:1.5}
.oad-create{width:min(100%,500px)}
.oad-card h2{font:inherit;font-size:19px;line-height:26px;font-weight:600;letter-spacing:-.025em;margin:0}

.oad-small,.oad-tag{color:var(--muted);font-size:12px}

<script>
function overlay(id){
  const fish=id==='takeback-fish', blocked=['backend','new-claude'].includes(id), cli=id==='backend'?'Antigravity':id==='new-claude'?'Claude Code':'Codex', create=blocked||id==='new';
  if(!create&&!fish&&!['handoff','takeback','end'].includes(id))return '';
  const session=fish?'Audit checklist':'Release notes';
  const note=(symbol,title,copy)=>`<div class="oad-note">${icon(symbol)}<div><strong>${title}</strong><p>${copy}</p></div></div>`;
  const field=(name,body)=>`<div class="oad-field"><span class="oad-label">${name}</span>${body}</div>`;
  const action=(dest,copy,variant='')=>`<a class="oad-btn ${variant}" href="#${dest}">${copy}</a>`;
  const choice=(dest,copy)=>`<a class="oad-option" href="#${dest}" ${dest===id?'aria-current="true"':''}>${dest===id?icon('check',14):''}${copy}</a>`;
  let title,desc,body,cancel,confirm;
  if(create){
    title='New outside agent'; desc='Start a CLI conversation that you control.'; cancel='wide-open';
    body=field('CLI',`<div class="oad-choices" role="group" aria-label="CLI">${choice('new','Codex')}${choice('new-claude','Claude Code')}${choice('backend','Antigravity CLI (agy)')}</div>`)
      +field('Workspace',`<select aria-label="Authorized workspace folder"><option>atlas · Authorized folder</option></select>`)
      +field(`${cli} model`,`<select aria-label="${cli} model" ${blocked?'disabled':''}><option>${blocked?'Catalog unavailable':'codex-fixture-a'}</option>${blocked?'':'<option>codex-fixture-b</option><option>CLI default</option>'}</select>`)
      +(blocked?note('alert','No models available',`${cli} did not return a complete catalog for atlas. Choose another CLI. Nothing has been started or sent.`):'')
      +field('First message','<textarea aria-label="First message" class="oad-input" required maxlength="2000">Draft release notes for atlas from the changes since the last tag.</textarea>');
    confirm=blocked?'<button class="oad-btn oad-primary" disabled>Start session</button>':action('idle','Start session','oad-primary');
  }else if(id==='handoff'){
    title='Hand to Fishball?'; desc=`Choose who can send messages and stop turns in ${session}. You’ll still be able to read the conversation.`; cancel='idle';
    body=field('Paired principal',`<label class="oad-principal">${icon('user',19)}<span><b>Fishball · fb-07</b><br><span class="oad-small">Stable principal ID: fb-07</span></span><input type="radio" name="oad-principal" value="fb-07" checked></label>`)
      +note('lock','Share from handoff onward','Fishball can read new messages only. Earlier messages stay private, and you can take back control at any time.');
    confirm=action('managed','Hand to Fishball','oad-primary');
  }else if(id==='end'){
    title='End session?'; desc=`This will terminate the Codex process for ${session} in atlas. You won’t be able to send another message to this session.`; cancel='idle';
    body=note('stop','End is different from Stop','Stop interrupts a turn and keeps the session open. End closes the CLI itself.'); confirm=action('ended','End session','oad-danger');
  }else{
    title='Take back control?'; desc=`Fishball · fb-07 will immediately lose control of ${session}. Its pending inputs and approvals will be withdrawn.`; cancel=fish?'fishball':'managed';
    body=note('clock','The current turn will keep running','You can stop it after taking back control. No pending message will be sent again.'); confirm=action(fish?'returned-fish':'returned','Take back control','oad-primary');
  }
  // Focus after the hash router has inserted this fragment into the shell.
  queueMicrotask(()=>{const card=document.querySelector('.oad-card');if(!card)return;card.querySelector('h2').focus({preventScroll:true});
    if(create){
      const draft=card.querySelector('textarea'), start=card.querySelector('a.oad-primary');
      draft.value=overlay.draft??draft.defaultValue;
      draft.oninput=()=>{overlay.draft=draft.value;draft.setCustomValidity(draft.value.trim()?'':'Enter a first message.');};
      if(start)start.onclick=e=>{if(!draft.reportValidity()||!draft.value.trim()){e.preventDefault();draft.focus();return;}overlay.model=card.querySelector('select[aria-label="Codex model"]').value==='codex-fixture-b'?'codex-fixture-b':'codex-fixture-a';overlay.firstMessage=draft.value.trim();delete overlay.draft;};
      card.querySelectorAll('.oad-close,.oad-actions a:not(.oad-primary)').forEach(a=>a.onclick=()=>{delete overlay.draft;});
    }
    card.onkeydown=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();card.querySelector('.oad-close').click();return;}
    if(e.key!=='Tab')return;
    const items=[...card.querySelectorAll('a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];
    if(e.shiftKey&&[items[0],card.querySelector('h2')].includes(document.activeElement)){e.preventDefault();items.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus();}
  };});
  return `<div class="oad-scrim"><section class="oad-card${create?' oad-create':''}" role="dialog" aria-modal="true" aria-labelledby="oad-title" aria-describedby="oad-desc"><div class="oad-head"><h2 id="oad-title" tabindex="-1">${title}</h2><a class="oad-close" href="#${cancel}" aria-label="Cancel and close dialog">${icon('x',18)}</a></div><p id="oad-desc" class="oad-desc">${desc}</p>${body}<div class="oad-actions">${action(cancel,'Cancel')}${confirm}</div></section></div>`;
}
</script>

<script>
let previous='', opener=null;
function render(){let i=screens.findIndex(r=>r[0]===location.hash.slice(1));if(i<0)i=0;const [id,label]=screens[i]; const dialog=overlay(id),frame=document.querySelector('#frame'), nav=document.querySelector('#reviewstrip');
frame.innerHTML=sidebar(id)+chat(id)+dialog;document.body.dataset.screen=id;document.title=label+' · Outside agent';
nav.innerHTML='<a href="index.html">← 评审索引</a><span class="meta">静态样稿 · 不连接 CLI</span><div class="steppers">'+(i?'<a aria-label="上一屏" href="#'+screens[i-1][0]+'">‹</a>':'')+'<span>'+String(i+1).padStart(2,'0')+' / '+screens.length+'　'+label+'</span>'+(i<screens.length-1?'<a aria-label="下一屏" href="#'+screens[i+1][0]+'">›</a>':'')+'</div>';
if(dialog){frame.querySelector('aside')?.setAttribute('inert','');frame.querySelector('main')?.setAttribute('inert','')}else if(opener){const back=[...frame.querySelectorAll('a[href]')].find(a=>a.hash===opener);back?.focus({preventScroll:true});opener=null}if(/^(rail|wide)-(open|closed)$/.test(id)&&/^(rail|wide)-(open|closed)$/.test(previous)) frame.querySelector('.oas-disclose')?.focus({preventScroll:true});previous=id}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&!a.closest('[role=dialog]')&&['new','handoff','takeback','takeback-fish','end'].includes(a.hash.slice(1)))opener=a.hash});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.dataset.screen==='rail-open'){e.preventDefault();location.hash='rail-closed'}});window.addEventListener('hashchange',render);render();</script></body></html>
