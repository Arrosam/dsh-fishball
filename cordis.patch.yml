# Fishball's profile footprint: two host rows.
# - fishball: the "body" in the main DSH. It manages your sessions for Fishball (Hand over,
#   message_fishball, permission requests, questions, watches) and serves the brand and the
#   session-row marks. Its id is also the settings namespace the Plugins page edits
#   (client.js ENTRY_ID).
# - fishball-native-host: starts the isolated Fishball (its own private DSH profile) after the
#   main DSH is ready, and stops it with DSH. Inserted here so a plain `dsh plugin add` needs no
#   profile edit. nodeExecutable and executableSearchPath default to DSH's PATH
#   (src/native-runtime/node-default.js); set them in this row's config to choose another Node.
#   An older install may also carry a hand-appended row with this id in the profile's own
#   cordis.patch.yml: remove that row before installing this version, since this one replaces it.
- insert:
    - id: fishball
      name: 'dsh-fishball'
      config: {}
    - id: fishball-native-host
      name: 'dsh-fishball/native-host'
      config: {}
