- insert:
    - id: dsh-fishball-bundle
      name: 'dsh-fishball-bundle'
      config: {}
    - id: dsh-connector
      name: 'dsh-agent-connector'
      config: {}
    - id: dsh-connector-ui
      name: ../dsh-agent-connector/ui/index.js
      config: {}
    - id: dsh-connector-adapter
      name: 'dsh-connector-adapter'
      config: {}
    - id: preset-watchdog
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: watchdog
        name: Watchdog
        description: Supervises a managed session for its manager (dsh-connector-watchdog).
        order: 90
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: true, write: false, edit: false }
    - id: dsh-connector-watchdog
      name: 'dsh-connector-watchdog'
      config: {}
    - id: dsh-instance
      name: 'dsh-instance'
      config: {}
