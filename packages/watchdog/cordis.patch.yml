# fishball-watchdog's bundle patch (task WD-ROUTE; R-WD-16; design §5a.2, §7.1; spike V3-S6 round 2
# `7c2230e`). Placement in a hosted child belongs to I-PLACE.
- insert:
    # Watchdog's own agent preset for its side sessions (R-WD-16). It is not a DSH-shipped preset,
    # so core's guards leave it on (GUARDS.watchdogAgentPreset). "Watchdog disabled" is the bundle's
    # switch on DSH's Plugins page (dsh.profile.bundles): the whole patch, this row included, is then
    # not composed, so the preset is absent. Switching off only the fishball-watchdog row below
    # leaves the preset; nothing runs it then, since only Watchdog opens its side sessions.
    # Tools (the user's decision, P-4): `read` and `read_image` only, as tool-fs with no write or
    # edit, and no session-creating tool; DSH's global `working_directory` stays (Fishball). The
    # judgement and patrol tools come from WD-DECIDE and WD-PATROL (W4) through Watchdog's own rows.
    # `id` is K3's GUARDS.watchdogAgentPreset; order 1 lists it after core's `fishball` (order 0).
    # DSH's preset-standard has order 1 too; core's guards switch it off, and an owner who
    # re-enables it only shares a list position.
    - id: preset-watchdog
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: watchdog
        order: 1
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: true, write: false, edit: false }
    - id: fishball-watchdog
      name: 'fishball-watchdog'
      config: {}
