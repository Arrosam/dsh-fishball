# fishball-ui's bundle patch (requirements 1.38 Q-N2, 1.41 Q-G1/Q-G2; R-FB-14; design §1.0, §5a.2).
#
# Only insert rows, and only fishball-ui's own: without core (Q-G2 = A) nothing changes in this DSH.
# A patch row that targets another layer's row always writes its value, whatever its `!!js`
# condition evaluates to (the host's `applyEntryPatches`, both SDKs). So a row here could not leave
# an earlier bundle's value alone without core. The UI guard rows and the hosted child's Preview
# Notice row are therefore in core's patch, which exists exactly when core does, conditional on
# fishball-ui (R-FIX-FUI, the user, 2026-11-18; core's `cordis.patch.yml`).
#
# Every row here depends on whether fishball-core is in this DSH: one test (the core-missing row) and
# its negation (the `without-core` anchor). YAML can neither share the bundle name with code nor reuse
# one expression in another, so the test is spelled out in both, with `fishball-core` as in core's
# `GUARDS.bundleName`:
# - with HMR (the `hmr` service, a standalone DSH by default): core is selected in the profile
#   manifest's `dsh.profile.bundles` now, read when the loader evaluates the row. DSH's HMR
#   recomposes the profile after the plugin manager changes that list and re-evaluates every row's
#   `disabled` (cordis-plugin-loader `EntryGroup.update`, both SDKs), so switching core on or off in
#   a running DSH switches these rows with it (F-WIRE: live core on/off);
# - without HMR (a hosted child: the instance switches HMR off), or when the manifest cannot be
#   read: core is among the bundles this process started with (`profileContext.startedBundles`,
#   the layers that loaded), as a change then needs a restart anyway.
# Accepted limit: while HMR is on, a core whose bundle is selected but skipped, or whose rows fail,
# counts as present.
# - With core: the page, the Recommended tab and the fishball-ui row run.
# - Without core: only `fishball-ui-core-missing` runs, to log `fishball-core-missing`.

- insert:
    # fishball-ui's Node row: the `fishballUiGuards` presence service (core's check reports the UI
    # guard rows only beside it), the status strip's and the pairing card's routes. Its browser half
    # is ./client (the ask cards, the two settings entries, the strip, the pairing card, the model
    # dialog). It is the package's one path row with no manifest of its own, so DSH serves fishball-ui's
    # client once.
    - id: fishball-ui
      name: ./index.js
      disabled: &without-core !!js "!((profile = ctx.get('profileContext')) => { try { return (ctx.get('hmr') === undefined ? profile?.startedBundles : JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(profile.dir, 'package.json'), 'utf8')).dsh?.profile?.bundles)?.includes('fishball-core') === true } catch { return profile?.startedBundles?.includes('fishball-core') === true } })()"
    # The page packages (I-PLACE). Each is its own small package (its own manifest and ./client), so
    # its path row is a client source of that package, not a second one of fishball-ui.
    - { id: fishball-page, name: ./fishball-page/index.js, disabled: *without-core }
    - { id: fishball-recommend-plugins, name: ./fishball-recommend-plugins/index.js, disabled: *without-core }
    # Without core: the one log line (src/core-missing.js). A package subpath, so it is no client source.
    - id: fishball-ui-core-missing
      name: fishball-ui/core-missing
      disabled: !!js "((profile = ctx.get('profileContext')) => { try { return (ctx.get('hmr') === undefined ? profile?.startedBundles : JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(profile.dir, 'package.json'), 'utf8')).dsh?.profile?.bundles)?.includes('fishball-core') === true } catch { return profile?.startedBundles?.includes('fishball-core') === true } })()"
