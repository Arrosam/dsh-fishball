<svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- dsh-connector-amenities's icon (ICON-SET, the user, 2026-11-18): the Fishball set's shared base,
       FishMark from Arrosam/fishball (app/src/main/java/org/areel/fishball/ui/Surfaces.kt, f4a887d;
       MIT, same author) on the launcher's ink tile, with this package's own badge at the bottom right.
       The badge is a paper chip in an ink ring (the ring is the cut-out that lifts it off the fish),
       holding a 16-unit glyph scaled 0.44 about the chip's centre. The glyph is DSH's IconAppsAddOutlineRegular (dsh-client-ui-primitives, MIT; its rounded squares written as paths): tiles and a plus, for the umbrella that adds the optional amenities. Its members' rows show their own icons.
       The colours are the launcher's, so one asset reads on DSH's light and dark surfaces: the Plugins
       page embeds the file as a data URL in an <img>, where currentColor and theme CSS never reach. -->
