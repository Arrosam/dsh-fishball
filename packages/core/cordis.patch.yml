# fishball-core's bundle patch (design §5a.2; R-FB-02; spike V3-S6 `86800d2` + round 2 `7c2230e`).
# This file is the ONE definition of the guards: src/guards/intended.js reads the guarded rows, the
# policy values and core's own presets back from it at runtime, so the check can never disagree
# with what the patch sets (v3-tasks W1 rules: the guards are defined exactly once).
#
# Rules this file relies on (cordis-plugin-include `applyEntryPatches`, both SDKs):
# - a patch reaches only rows an EARLIER layer inserted, so core's bundle must be last
#   (R-FB-12): src/guards/reorder.js arranges that in standalone mode; the instance writes it in a
#   hosted child (I-PLACE);
# - a patch's `config` REPLACES the row's whole config, so a policy row restates every key DSH ships
#   (the `!!js` workspace root included);
# - the owner's profile patch, home patch and launch overlays apply after this file, so the owner can
#   override any guard (Q20); core then reports `guards-overridden` and changes nothing back (R-FB-09).
#
# A guard is a bare `{id, disabled: true}` row; intended.js reads exactly that shape as a guard.

# Session-creating service rows (V2 LITE). schedule: scheduled prompts run as new sessions;
# open-in-app: native launches off the page; terminal-controller: a shell outside read-only. Their
# UI rows (ui-schedule, ui-open-in-app, ui-sidebar-terminal and the other ui-* rows) are UI-only and
# are fishball-ui's guard rows, in fishball-ui's own patch (R-FB-14, F-UI). Each service these rows
# provide is injected only by another row switched off here or there (checked in 0.2.1-rc.5 and
# 0.2.2-rc.1), so boot is unaffected.
- { id: schedule, disabled: true }
- { id: open-in-app, disabled: true }
- { id: terminal-controller, disabled: true }
# No nested hosted Fishball (UIM-DT-01 row 10b).
- { id: dsh-instance, disabled: true }

# Agent presets (Q-S6-2 decided B, amended; requirements 1.24). The session-creating tools live inside
# each shipped preset's `config.plugins`, which no patch can reach (S6 §3.2), so every DSH-shipped
# preset is switched OFF here, never deleted. The ids are the same on both SDKs
# (`dsh-web-app/presets/`). Core's own preset is the only one offered (design `9a531192` §1.0, §7; requirements 1.37).
- { id: preset-standard, disabled: true }
- { id: preset-ptc, disabled: true }
- { id: preset-cordis, disabled: true }
- { id: preset-minimal, disabled: true }

# Effective read-only (V2 LITE). The approval policy stays `ask`: `never` would mean "allowed without
# asking". The private Skills exception needs no row: the manager-scoped confined provider of
# src/manager/skills.js is the only writer of Fishball's own skills.
- id: sandbox-policy
  config:
    mode: &read-only read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: &ask ask
# Only the read-only permission preset, so `/permission` refuses every other name.
- id: permission
  config:
    presets:
      read-only: { sandbox: *read-only, approval: *ask }
    defaultPreset: *read-only
- id: agent-preset-registry
  config:
    default: &fishball fishball

- insert:
    # Core's own agent preset for the manager: `read` and `read_image` (tool-fs with no write or
    # edit); `working_directory` is DSH's global tool (dsh-base). No persona row: core composes the
    # manager's persona in code on create and on every resume (src/manager/persona.js).
    - id: preset-fishball
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: *fishball
        order: 0
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: true, write: false, edit: false }
    # Core's guard row: the check, the `guards-overridden` report (fishball-ui's UI guard rows
    # included when fishball-ui is installed) and the standalone self-reorder (src/guards/). The
    # Fishball page and the Recommended tab are fishball-ui's rows since F-UI.
    - id: fishball-core-guards
      name: ./src/guards/row.js
    # Core's main row (src/main/, F-WIRE): the link, Connect, the interception service, the ask
    # cards, status, the bridge façade and the one manager session with its persona, reminders and
    # private Skills; it provides `fishballInstance` and `fishballStatus`. Its id is its settings
    # namespace (core's own settings page edits it). A package subpath, never a path row: DSH's
    # client modules count every path row inside core's folder as another client source of
    # fishball-core and refuse the package (I-PLACE probe, both SDKs). Not `required` (decided
    # 2026-11-15 for core's rows): a failure is this row's alone, and the DSH still boots.
    - { id: fishball-core, name: fishball-core/main }
    # The Fishball page's manager-session route (src/session/route.js), core's own since I-HOST, so
    # fishball-ui's page finds it in a hosted child and in a standalone DSH alike. Its one inject is
    # `connection`.
    - { id: fishball-core-session, name: fishball-core/session-route }
