# fishball-core's bundle patch (design §5a.2; R-FB-02; spike V3-S6 `86800d2` + round 2 `7c2230e`).
# This file is the ONE definition of the guards: src/guards/intended.js reads the guarded rows, the
# policy values and core's own presets back from it at runtime, so the check can never disagree
# with what the patch sets (v3-tasks W1 rules: the guards are defined exactly once).
#
# Rules this file relies on (cordis-plugin-include `applyEntryPatches`, both SDKs):
# - a patch reaches only rows an EARLIER layer inserted, so core's bundle must be last
#   (R-FB-12): src/guards/reorder.js arranges that in standalone mode; the instance writes it in a
#   hosted child (I-PLACE);
# - a patch's `config` REPLACES the row's whole config, so a policy row restates every key DSH ships
#   (the `!!js` workspace root included);
# - the owner's profile patch, home patch and launch overlays apply after this file, so the owner can
#   override any guard (Q20); core then reports `guards-overridden` and changes nothing back (R-FB-09).
#
# A guard is a bare `{id, disabled: true}` row; intended.js reads exactly that shape as a guard.
# fishball-ui's UI guard rows are here too, conditional on fishball-ui (below, R-FIX-FUI).

# Session-creating service rows (V2 LITE). schedule: scheduled prompts run as new sessions;
# open-in-app: native launches off the page; terminal-controller: a shell outside read-only. Their
# UI rows (ui-schedule, ui-open-in-app, ui-sidebar-terminal and the other ui-* rows) are UI-only and
# are fishball-ui's guard rows (R-FB-14, F-UI), switched with fishball-ui below. Each service these rows
# provide is injected only by another row switched off here (checked in 0.2.1-rc.5 and
# 0.2.2-rc.1), so boot is unaffected.
- { id: schedule, disabled: true }
- { id: open-in-app, disabled: true }
- { id: terminal-controller, disabled: true }
# No nested hosted Fishball (UIM-DT-01 row 10b).
- { id: dsh-instance, disabled: true }

# Agent presets (Q-S6-2 decided B, amended; requirements 1.24). The session-creating tools live inside
# each shipped preset's `config.plugins`, which no patch can reach (S6 §3.2), so every DSH-shipped
# preset is switched OFF here, never deleted. The ids are the same on both SDKs
# (`dsh-web-app/presets/`). Core's own preset is the only one offered (design `9a531192` §1.0, §7; requirements 1.37).
- { id: preset-standard, disabled: true }
- { id: preset-ptc, disabled: true }
- { id: preset-cordis, disabled: true }
- { id: preset-minimal, disabled: true }

# Effective read-only (V2 LITE). The approval policy stays `ask`: `never` would mean "allowed without
# asking". The private Skills exception needs no row: the manager-scoped confined provider of
# src/manager/skills.js is the only writer of Fishball's own skills.
- id: sandbox-policy
  config:
    mode: &read-only read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: &ask ask
# Only the read-only permission preset, so `/permission` refuses every other name.
- id: permission
  config:
    presets:
      read-only: { sandbox: *read-only, approval: *ask }
    defaultPreset: *read-only
- id: agent-preset-registry
  config:
    default: &fishball fishball

# fishball-ui's rows, kept here since R-FIX-FUI (the user, 2026-11-18): a patch row always writes its
# value, so a row in fishball-ui's own patch could not "change nothing" without core (Q-G2 = A).
# It would overwrite what an earlier bundle set (the host's `applyEntryPatches`, both SDKs). This
# patch exists exactly when core does, so these rows apply only beside core. Each one also depends on
# whether fishball-ui is in this DSH, because UI-only rows are fishball-ui's concern (R-FB-14) and core
# alone shows DSH's own UI (Q-G1). Accepted limit: with core but without fishball-ui these rows read
# `disabled: false` and the Preview Notice value `undefined`. So an earlier bundle's setting of one of
# them is lost then. No DSH-shipped bundle patches them. The counterpart, also accepted: while HMR
# is on, a fishball-ui that is selected but skipped, or whose row fails, counts as present, so these
# rows are off and, with no `fishballUiGuards` service, not reported.
# The test, `fishball-ui` as in its package name (YAML can neither share it with code nor reuse one
# expression in another, so the Preview Notice row below spells its own):
# - with HMR (the `hmr` service, a standalone DSH by default): fishball-ui is selected in the profile
#   manifest's `dsh.profile.bundles` now, read when the loader evaluates the row. DSH's HMR
#   recomposes the profile after the plugin manager changes that list and re-evaluates every row's
#   `disabled` (cordis-plugin-loader `EntryGroup.update`, both SDKs), so switching fishball-ui on or
#   off in a running DSH switches these rows with it;
# - without HMR (a hosted child: the instance switches HMR off), or when the manifest cannot be read:
#   fishball-ui is among the bundles this process started with (`profileContext.startedBundles`).
# A UI guard row is a bare `{id, disabled: !!js}` row; src/guards/intended.js reads exactly that shape
# as a UI guard (`uiRows`). Core's check reports one only while fishball-ui's `fishballUiGuards`
# service is there (src/guards/check.js).
#
# UI-only session-creating rows (V2 LITE; their service rows are the guards above). ui-subagent: header
# lineage and catalogue tree items open other sessions; ui-schedule: scheduled prompts run as new
# sessions; ui-permission/ui-agent-preset: permission and preset pickers (the preset creator also
# starts sessions); entry-customization: More-menu rows that start sessions; ui-open-in-app: native
# launches off the page; ui-sidebar-terminal: a shell outside read-only. They are browser rows with
# an empty Node half and no service another row injects (checked in 0.2.1-rc.5 and 0.2.2-rc.1).
- { id: ui-subagent, disabled: &with-ui true }
- { id: ui-schedule, disabled: *with-ui }
- { id: ui-permission, disabled: *with-ui }
- { id: ui-agent-preset, disabled: *with-ui }
- { id: entry-customization, disabled: *with-ui }
- { id: ui-open-in-app, disabled: *with-ui }
- { id: ui-sidebar-terminal, disabled: *with-ui }
# ui-model-selection: the composer's model seat and the /model popup (dsh-web-app, both SDKs). Only
# core's settings choose Fishball's model (the user, 2026-11-16: "Hide it. Only core's settings
# choose the model"); fishball-ui's model dialog and core's settings page write it. No other row
# injects its `modelDirectories` service (checked in 0.2.1-rc.5 and 0.2.2-rc.1).
- { id: ui-model-selection, disabled: *with-ui }

# DSH's Preview Notice, in a hosted child only (E-FIX-3 B7; the user: the framed window is "完全一样"
# as the standalone page, where the user met the notice already). Not a guard row (it has a config).
- id: ui-settings-general
  config:
    welcomeNoticeVersion: !!js "((profile = ctx.get('profileContext')) => profile?.overlays?.some((patch) => patch.insert?.some((row) => row.id === 'dsh-instance-child')) === true ? '2026-09-28.1' : undefined)()"

- insert:
    # Core's own agent preset for the manager: `read` and `read_image` (tool-fs with no write or
    # edit); `working_directory` is DSH's global tool (dsh-base); `ask_user_question` is DSH's
    # ask-user plugin, so Fishball asks with the same inline question card as any DSH session
    # (the user, 2026-11-18). No persona row: core composes the manager's persona in code on
    # create and on every resume (src/manager/persona.js).
    - id: preset-fishball
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: *fishball
        order: 0
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config: { read: true, readImage: true, write: false, edit: false }
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
    # Core's guard row: the check, the `guards-overridden` report and the standalone self-reorder (src/guards/).
    - id: fishball-core-guards
      name: ./src/guards/row.js
    # Core's main row (src/main/, F-WIRE): the link, Connect, the interception service, the ask
    # cards, status, the bridge façade and the one manager session with its persona, reminders and
    # private Skills; it provides `fishballInstance` and `fishballStatus`. Its id is its settings
    # namespace (core's own settings page edits it).
    - { id: fishball-core, name: fishball-core/main }
    # The Fishball page's manager-session route (src/session/route.js).
    - { id: fishball-core-session, name: fishball-core/session-route }
    # Fishball UI component (sub-package under ./ui/): Fishball page, Recommended tab (standalone
    # only), the instance-run child's Plugins page changes, sidebar targets, ask cards, brand row and
    # model dialog. Toggleable independently as a component row.
    - { id: fishball-ui, name: ./ui/index.js }
    - { id: fishball-page, name: ./ui/fishball-page/index.js }
    # Instance-run or standalone (DESIGN §28): the child is instance-run exactly while the instance's
    # launch overlay inserts its child-side row `dsh-instance-child` (the Preview Notice row's test
    # above, spelled again: YAML cannot share one expression between two rows, and these two differ
    # by their negation). Only the main DSH installs into an instance-run child, so there the
    # Recommended tab is off (its list moves to the instance's UI in the main DSH) and
    # fishball-child-plugins hides DSH's own install entries with its notice; a standalone Fishball
    # keeps the tab and DSH's Plugins page unchanged.
    - id: fishball-recommend-plugins
      name: ./ui/fishball-recommend-plugins/index.js
      disabled: !!js "((profile = ctx.get('profileContext')) => profile?.overlays?.some((patch) => patch.insert?.some((row) => row.id === 'dsh-instance-child')) === true)()"
    - id: fishball-child-plugins
      name: ./ui/fishball-child-plugins/index.js
      disabled: !!js "((profile = ctx.get('profileContext')) => profile?.overlays?.some((patch) => patch.insert?.some((row) => row.id === 'dsh-instance-child')) !== true)()"
