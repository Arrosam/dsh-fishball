<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The title, <html lang> and the region names come from ui/i18n.js (I9); ui/shell.js sets them. -->
<title></title>
<link rel="icon" href="data:,">
<!-- DSH's design tokens first (I8): shell.css draws every colour, radius, font and shadow from them. -->
<link rel="stylesheet" href="ui/dsh-tokens.css">
<link rel="stylesheet" href="ui/shell.css">
</head>
<body>
<!-- No title and no status tag (D27): the connector's frame shows Fishball's name and state. -->
<header class="topbar">
  <div class="model-picker" id="model-picker"></div>
  <!-- Header actions: Settings in the chat, Back in the settings view (I6; ui/shell.js). -->
  <div class="header-actions" id="header-actions"></div>
</header>
<!-- Shown only while the event stream is lost (§11). -->
<p class="connection-banner" id="connection-banner" role="status" aria-live="polite" hidden></p>
<main class="layout">
  <!-- The chat view builds the timeline, the read-only composer and the notice in here. -->
  <section class="chat" id="chat"></section>
  <!-- The reminder view (T10) mounts into this aside and refreshes on the SSE reminders event. -->
  <aside class="sidebar" id="reminders"></aside>
</main>
<!-- The settings view (I6, ?view=settings); ui/settings.js builds it on first open. -->
<main class="settings-page" id="settings" hidden></main>
<!-- Relative URLs keep the one shell working at the child's "/" and behind "/fishball/embed/". -->
<script type="module" src="ui/shell.js"></script>
</body>
</html>
